name: Update Steam playtime data

on:
  schedule:
    # 매 3시간마다 자동 실행 (UTC 기준, GitHub 무료 요금제 최소 간격 권장치)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update-steam-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 스팀 데이터 가져오기
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/fetch-steam.mjs

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "steam-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add steam-data.json
          git diff --staged --quiet || git commit -m "chore: update steam playtime data"
          git push
